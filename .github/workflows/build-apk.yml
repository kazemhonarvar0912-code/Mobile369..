
name: Build Mobile369 APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile369-source.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'    
    
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          test -d "$ANDROID_HOME"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract mobile app
        run: unzip -q mobile369-source.zip -d project
      - name: Build debug APK
        working-directory: project/Mobile369-Android-Staff-v1.0-Source
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile369-Android-Install
          path: project/Mobile369-Android-Staff-v1.0-Source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
